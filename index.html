<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title> Cross-Border Agent Workspace</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; background-color: #f5f5f7; color: #1d1d1f; -webkit-font-smoothing: antialiased; }
        #app { display: flex; height: 100vh; overflow: hidden; }
        
        /*  左侧自适应多租户会话导航栏 */
        .sidebar { width: 260px; background-color: #ffffff; border-right: 1px solid #e5e5e7; display: flex; flex-direction: column; }
        .sidebar-header { padding: 24px 20px 15px 20px; }
        .sidebar-header h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.5px; }
        .sidebar-header p { font-size: 11px; color: #86868b; margin: 4px 0 0 0; text-transform: uppercase; }
        .session-list { flex: 1; overflow-y: auto; padding: 10px; }
        .session-item { padding: 12px 14px; border-radius: 10px; margin-bottom: 6px; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 10px; }
        .session-item:hover { background-color: #f5f5f7; }
        .session-item.active { background-color: #e3f2fd; color: #0071e3; font-weight: 500; }
        .avatar { width: 32px; height: 32px; background: #e5e5ea; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .session-item.active .avatar { background: #0071e3; color: white; }

        /*  中央主业务流控制中心 */
        .main-content { flex: 1; display: flex; flex-direction: column; background: #f5f5f7; }
        
        /* 顶层高管看板 */
        .top-navbar { height: 75px; background: #ffffff; border-bottom: 1px solid #e5e5e7; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; }
        .navbar-stats { display: flex; gap: 40px; }
        .stat-entry { display: flex; flex-direction: column; }
        .stat-entry .label { font-size: 11px; color: #86868b; font-weight: 500; margin-bottom: 2px; }
        .stat-entry .value { font-size: 16px; font-weight: 600; color: #1d1d1f; }

        /* 黄金 3:1 工作域 */
        .workspace-body { flex: 1; display: flex; overflow: hidden; }
        .chat-section { flex: 3; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }
        
        /* iMessage 奢华会话层 */
        .chat-messages { flex: 1; background: #ffffff; border-radius: 16px; padding: 24px; overflow-y: auto; box-shadow: 0 4px 24px rgba(0,0,0,0.01); display: flex; flex-direction: column; gap: 14px; margin-bottom: 16px; }
        .msg-row { display: flex; width: 100%; }
        .msg-row.user { justify-content: flex-end; }
        .msg-row.assistant { justify-content: flex-start; }
        .bubble { padding: 12px 18px; border-radius: 20px; font-size: 14.5px; line-height: 1.5; max-width: 70%; word-break: break-all; }
        .msg-row.user .bubble { background-color: #0071e3; color: #ffffff; border-bottom-right-radius: 4px; }
        .msg-row.assistant .bubble { background-color: #e5e5ea; color: #1d1d1f; border-bottom-left-radius: 4px; }
        
        /* 胶囊输入栏 */
        .input-bar { display: flex; gap: 12px; }
        .input-bar input { flex: 1; padding: 14px 20px; border: none; border-radius: 24px; background: #ffffff; font-size: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.02); outline: none; }
        .input-bar button { padding: 0 28px; background: #0071e3; color: white; border: none; border-radius: 24px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
        .input-bar button:hover { background: #0077ed; }

        /* 右侧可观测性黑盒 */
        .observability-section { flex: 1; border-left: 1px solid #e5e5e7; padding: 20px; display: flex; flex-direction: column; background: #ffffff; }
        .panel-title { font-size: 14px; font-weight: 600; color: #1d1d1f; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
        .console-window { flex: 1; width: 100%; background: #f5f5f7; border: none; border-radius: 12px; padding: 15px; box-sizing: border-box; font-family: "SF Mono", Menlo, monospace; font-size: 12px; line-height: 1.6; color: #1d1d1f; resize: none; outline: none; }
        
        /* 底部 RAG 上传卡片 */
        .rag-card { margin-top: 15px; background: #f5f5f7; border-radius: 12px; padding: 14px; }
        .file-btn { width: 100%; padding: 10px; background: #e5e5ea; text-align: center; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; display: block; box-sizing: border-box; }
        .file-btn:hover { background: #dcdcdc; }
        .rag-status { font-size: 11px; color: #86868b; margin-top: 8px; text-align: center; word-break: break-all; }
    </style>
</head>
<body>

<div id="app">
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>Workspace</h1>
            <p>Multi-Tenant Session Flow</p>
        </div>
        <div class="session-list">
            <div v-for="sess in sessions" 
                 :key="sess.id" 
                 :class="['session-item', { active: currentSessionId === sess.id }]"
                 @click="switchSession(sess.id)">
                <div class="avatar">{{ sess.name[0] }}</div>
                <div style="flex:1;">
                    <div style="font-size: 13.5px; font-weight: 500;">{{ sess.name }}</div>
                    <div style="font-size: 11px; color: #86868b; margin-top: 2px;">{{ sess.lastMsg }}</div>
                </div>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="top-navbar">
            <div style="font-weight: 600; font-size: 18px;">{{ currentSessionId }}</div>
            <div class="navbar-stats">
                <div class="stat-entry">
                    <span class="label">TOTAL FINOPS COST</span>
                    <span class="value" style="color: #ff9500;">$ {{ totalCost.toFixed(5) }}</span>
                </div>
                <div class="stat-entry">
                    <span class="label">SYSTEM STATUS</span>
                    <span class="value" style="color: #34c759;">🟢 WebSocket Active</span>
                </div>
            </div>
        </div>

        <div class="workspace-body">
            <div class="chat-section">
                <div class="chat-messages" id="chatBox">
                    <div v-for="(msg, index) in activeMessages" :key="index" :class="['msg-row', msg.role]">
                        <div class="bubble">{{ msg.content }}</div>
                    </div>
                </div>
                
                <div class="input-bar">
                    <input type="text" 
                           v-model="inputTxt" 
                           @keyup.enter="triggerSend"
                           placeholder="Type a message to route to specific session pipeline...">
                    <button @click="triggerSend">Send</button>
                </div>
            </div>

            <div class="observability-section">
                <div class="panel-title">🤖 ReAct Observability</div>
                <textarea class="console-window" readonly :value="consoleLog" id="consoleWin" placeholder="Awaiting state machine signals..."></textarea>
                
                <div class="rag-card">
                    <div class="panel-title" style="font-size: 13px; margin-bottom: 8px;">📚 Knowledge Synchronization</div>
                    <label class="file-btn">
                        📎 Upload Handbook (.pdf/.txt/.md)
                        <input type="file" ref="fileInput" style="display: none;" @change="handleRagUpload">
                    </label>
                    <div class="rag-status">{{ ragStatus }}</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const { createApp, ref, computed, watch, nextTick } = Vue;

    createApp({
        setup() {
            // 响应式状态流
            const currentSessionId = ref('Wantao_Client_888');
            const inputTxt = ref('');
            const consoleLog = ref('');
            const totalCost = ref(0.0);
            const ragStatus = ref('Pipeline idle...');
            const fileInput = ref(null);

            // 模拟多租户列表数据（完全匹配你后端的 SQL 物理隔离机制）
            const sessions = ref([
                { id: 'Wantao_Client_888', name: 'Wantao (欧洲大客)', lastMsg: '等待坐席上线...' },
                { id: 'Germany_Buyer_002', name: 'Müller (德国硬件商)', lastMsg: 'Awaiting connection...' },
                { id: 'SaaS_Tenant_Test', name: 'Sandbox (沙箱测试客)', lastMsg: 'Pipeline ready.' }
            ]);

            // 内存会话历史树：按 session_id 深度隔离
            const historyMap = ref({
                'Wantao_Client_888': [{ role: 'assistant', content: '您好！我是您的跨境私域大客户智能助理。我们的 V5.2 系统已成功接入结构化 SQL 数据库与原生异步 WebSocket 通道，请问有什么可以帮您？' }],
                'Germany_Buyer_002': [{ role: 'assistant', content: 'Hello! This is enterprise automation system. How can I help you today?' }],
                'SaaS_Tenant_Test': [{ role: 'assistant', content: '🟢 [SaaS 多租户系统就绪] 当前正在进行多路会话隔离测试。' }]
            });

            // 计算属性：动态提取当前激活的聊天历史
            const activeMessages = computed(() => historyMap.value[currentSessionId.value] || []);

            let ws = null;

            // 核心大招：动态全双工长连接管理函数
            const initWebSocket = () => {
                if (ws) {
                    ws.close();
                }
                consoleLog.value = `🔌 正在为会话 [${currentSessionId.value}] 建立独立长连接隧道...\n`;
                
                // 动态向 FastAPI 挂载 session_id 查询参数
                ws = new WebSocket(`ws://127.0.0.1:8000/ws/agent/chat?session_id=${currentSessionId.value}`);

                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === 'streaming') {
                        // 1. 灌入流式思考轨迹
                        if (data.log_stream) {
                            consoleLog.value = data.log_stream;
                            scrollBottom('consoleWin');
                        }
                        // 2. 灌入流式最终答复
                        if (data.final_answer && data.final_answer !== "Agent 正在深度思考中...") {
                            const history = historyMap.value[currentSessionId.value];
                            if (history[history.length - 1].role === 'assistant') {
                                history[history.length - 1].content = data.final_answer;
                            }
                        }
                        // 3. 灌入流式计费
                        if (data.turn_cost) {
                            totalCost.value = data.turn_cost;
                        }
                    } else if (data.type === 'done') {
                        // 本轮对话结束，同步更新侧边栏预览摘要
                        const history = historyMap.value[currentSessionId.value];
                        const last = history[history.length - 1];
                        const target = sessions.value.find(s => s.id === currentSessionId.value);
                        if (target && last) {
                            target.lastMsg = last.content.substring(0, 15) + '...';
                        }
                    }
                };
            };

            // 切换租户监听
            const switchSession = (sid) => {
                currentSessionId.value = sid;
                consoleLog.value = `📋 已切换至租户 [${sid}]，正在拉取该路由专属状态机...`;
                initWebSocket();
            };

            // 触发发送数据包
            const triggerSend = () => {
                const msg = inputTxt.value.trim();
                if (!msg) return;

                // 1. 本地响应式推入用户消息气泡
                historyMap.value[currentSessionId.value].push({ role: 'user', content: msg });
                
                // 2. 预先垫入一个空的 AI 客服气泡，等待流式灌入
                historyMap.value[currentSessionId.value].push({ role: 'assistant', content: '🧬 思考中...' });
                
                scrollBottom('chatBox');

                // 3. 压缩并打包发送标准的 Vue 结构化 JSON 载荷
                ws.send(JSON.stringify({
                    message: msg,
                    history: historyMap.value[currentSessionId.value].slice(0, -2) // 剥离掉刚刚垫底的这一轮
                }));

                inputTxt.value = '';
            };

            // 🌟 原生 Ajax (Fetch) 多格式 RAG 上传逻辑
            const handleRagUpload = async (event) => {
                const file = event.target.files[0];
                if (!file) return;

                ragStatus.value = `⏳ 正在通过 HTTP 管道向 FastAPI 上传: ${file.name}...`;
                
                const formData = new FormData();
                formData.append('file', file);

                try {
                    const response = await fetch('http://127.0.0.1:8000/api/upload', {
                        method: 'POST',
                        body: formData
                    });
                    const resData = await response.json();
                    if (resData.success) {
                        ragStatus.value = resData.message;
                    } else {
                        ragStatus.value = `❌ 上传失败: ${resData.message}`;
                    }
                } catch (err) {
                    ragStatus.value = `❌ 网络异常: ${err.message}`;
                }
                // 清空 input 释放指针
                fileInput.value.value = '';
            };

            // 工具：Dom 滚动条触底
            const scrollBottom = (id) => {
                nextTick(() => {
                    const el = document.getElementById(id);
                    if (el) el.scrollTop = el.scrollHeight;
                });
            };

            // 生命周期挂载自动拉起初始会话的长连接
            watch(currentSessionId, () => {}, { immediate: true });
            initWebSocket();

            return {
                currentSessionId,
                inputTxt,
                consoleLog,
                totalCost,
                ragStatus,
                fileInput,
                sessions,
                activeMessages,
                switchSession,
                triggerSend,
                handleRagUpload
            };
        }
    }).mount('#app');
</script>
</body>
</html>
